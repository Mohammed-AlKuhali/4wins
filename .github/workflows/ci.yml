name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 4wins_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/4wins_test
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars!
      GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Build (embeds GIT_SHA into dist/version.json)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run integration tests (audit endpoint)
        run: |
          node --import tsx/esm src/index.ts &
          sleep 3
          INTEGRATION=1 npm test -- src/__tests__/audit.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/4wins_test
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars!
          GIT_SHA: ${{ github.sha }}

  mobile-typecheck:
    name: Mobile type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/mobile
